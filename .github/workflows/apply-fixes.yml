name: Apply staged fixes
on:
  push:
    branches: [fix/revue-securite]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download patches
        run: |
          set -euo pipefail
          base=https://actyl-staging-relay.tckgrg9ytv.workers.dev/relay
          for i in $(seq 1 40); do
            curl -fsS "$base/fixes" -o /tmp/fixes.patch && break
            sleep 30
          done
          test -s /tmp/fixes.patch
          echo '350e4693f68d7cdfb1a62175f18619b58ea06af563ac100966c39df3d78afa78  /tmp/fixes.patch' | sha256sum -c -
          ok=0
          for i in $(seq 1 6); do
            if curl -fsS "$base/wrangler" -o /tmp/wrangler.patch; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || : > /tmp/wrangler.patch
      - name: Apply and push
        run: |
          set -euo pipefail
          git config user.name tomjanvier
          git config user.email 154245519+tomjanvier@users.noreply.github.com
          git apply --check /tmp/fixes.patch
          git apply /tmp/fixes.patch
          git add -A
          git commit -m 'fix: correctifs de securite (revue) - transactions Neon, isolation des listes, CSV, OIDC, dependances'
          if [ -s /tmp/wrangler.patch ] && git apply --check /tmp/wrangler.patch; then
            git apply /tmp/wrangler.patch
            git add -A
            git commit -m 'chore: wrangler >= 4.135 pour Workers Previews'
          fi
          git rm -q .github/workflows/apply-fixes.yml
          git commit -m 'chore: retirer le workflow temporaire'
          git push origin fix/revue-securite

name: Regenerate lockfile (temp)

on:
  push:
    branches: [chore/next-16]

permissions:
  contents: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/next-16
      - uses: pnpm/action-setup@v4
        # Reads packageManager from package.json (pnpm@10.34.9)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Regenerate pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit regenerated lockfile
        run: |
          git config user.name "tomjanvier"
          git config user.email "154245519+tomjanvier@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && echo "Lockfile unchanged" && exit 0
          git commit -m "chore: lockfile régénéré pour Next 16.4.5"
          git push
